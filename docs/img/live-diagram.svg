<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<title id="t">How Sinko answers a question from a phone</title>
<desc id="d">An animation. A phone asks the Sinko box where youtube.com is; the box checks its rules, asks the internet, and the phone gets the answer, so the app works. Then the phone asks for tiktok.com; the box has it blocked and answers no, so the app does not open. A live list below records both.</desc>
<style>
svg{--bg:#E9E7E1;--card:#F6F5F1;--line:#C9C5BA;--ink:#1B1B19;--ink2:#5E5B53;--ok:#1F6B30;--oksoft:#E0DDD5;--no:#B42318;--nosoft:#F3DEDA;--night:#1B1B19;--box:#1B1B19;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
@media (prefers-color-scheme:dark){svg{--bg:#161614;--card:#22221F;--line:#46443E;--ink:#ECEAE4;--ink2:#A9A59B;--ok:#2B8A3E;--oksoft:#1B1B19;--no:#B42318;--nosoft:#3A1E19;--night:#0B0B0A;--box:#0B0B0A}}
.bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--line);stroke-width:2}
.wire{stroke:var(--line);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;fill:none}
.t{fill:var(--ink);font-size:17px;font-weight:700}.s{fill:var(--ink2);font-size:14px}
.pill-ok{fill:var(--ok)}.pill-no{fill:var(--no)}.pt{fill:#fff;font-size:13px;font-weight:700}
.box{fill:var(--box);stroke:var(--line);stroke-width:2}.led{fill:#fff}
.p{opacity:0;animation-duration:10s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.a1{animation-name:a1}.a2{animation-name:a2}.a3{animation-name:a3}.a4{animation-name:a4}
.b1{animation-name:b1}.b2{animation-name:b2}
@keyframes a1{0%{opacity:0;transform:translateX(0)}2%{opacity:1}10%{opacity:1;transform:translateX(100px)}11%,100%{opacity:0;transform:translateX(100px)}}
@keyframes a2{0%,11%{opacity:0;transform:translateX(0)}12%{opacity:1}24%{opacity:1;transform:translateX(120px)}25%,100%{opacity:0;transform:translateX(120px)}}
@keyframes a3{0%,28%{opacity:0;transform:translateX(0)}29%{opacity:1}41%{opacity:1;transform:translateX(-330px)}42%,100%{opacity:0;transform:translateX(-330px)}}
@keyframes a4{0%,43%{opacity:0;transform:translateX(0)}44%{opacity:1}50%{opacity:1;transform:translateX(-230px)}51%,100%{opacity:0;transform:translateX(-230px)}}
@keyframes b1{0%,52%{opacity:0;transform:translateX(0)}53%{opacity:1}61%{opacity:1;transform:translateX(100px)}62%,100%{opacity:0;transform:translateX(100px)}}
@keyframes b2{0%,68%{opacity:0;transform:translateX(0)}69%{opacity:1}77%{opacity:1;transform:translateX(-230px)}78%,100%{opacity:0;transform:translateX(-230px)}}
.fade{opacity:0;animation-duration:10s;animation-iteration-count:infinite}
.okmark{animation-name:okm}.nomark{animation-name:nom}.ledok{animation-name:ledo}.ledno{animation-name:ledn}
.row1{animation-name:r1}.row2{animation-name:r2}.scan{animation-name:scan}
@keyframes okm{0%,50%{opacity:0}53%,60%{opacity:1}64%,100%{opacity:0}}
@keyframes nom{0%,77%{opacity:0}80%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes ledo{0%,11%{opacity:0}13%,24%{opacity:1}27%,100%{opacity:0}}
@keyframes ledn{0%,61%{opacity:0}63%,70%{opacity:1}73%,100%{opacity:0}}
@keyframes r1{0%,50%{opacity:0;transform:translateY(8px)}54%,95%{opacity:1;transform:none}99%,100%{opacity:0}}
@keyframes r2{0%,78%{opacity:0;transform:translateY(8px)}82%,95%{opacity:1;transform:none}99%,100%{opacity:0}}
@keyframes scan{0%,11%{opacity:0}13%,22%{opacity:.9}26%,59%{opacity:0}62%,70%{opacity:.9}74%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.p,.fade{animation:none}.p{opacity:0}.okmark,.nomark,.row1,.row2{opacity:1}}
</style>
<rect class="bg" width="900" height="400" rx="22"/>
<!-- wires -->
<path class="wire" d="M170 135H400M500 135H730"/>
<path class="wire" d="M170 165H400M500 165H730"/>
<!-- phone -->
<rect class="card" x="80" y="82" width="90" height="140" rx="16"/>
<rect x="92" y="98" width="66" height="96" rx="8" style="fill:var(--bg)"/>
<circle cx="125" cy="208" r="5" style="fill:var(--line)"/>
<g class="fade okmark"><circle cx="125" cy="146" r="22" class="pill-ok"/><path d="M114 146l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fade nomark"><circle cx="125" cy="146" r="22" class="pill-no"/><path d="M115 136l20 20M135 136l-20 20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>
<text class="t" x="125" y="252" text-anchor="middle">A phone</text>
<text class="s" x="125" y="272" text-anchor="middle">asks first</text>
<!-- box -->
<rect class="box" x="400" y="92" width="100" height="120" rx="18"/>
<rect x="414" y="108" width="72" height="12" rx="6" fill="#fff" opacity=".28"/>
<circle class="led" cx="424" cy="190" r="5"/><circle class="led" cx="440" cy="190" r="5" opacity=".5"/>
<rect class="fade scan" x="406" y="124" width="88" height="3" rx="1.5" fill="#fff"/>
<circle class="fade ledok" cx="476" cy="190" r="7" fill="#3FA556"/>
<circle class="fade ledno" cx="476" cy="190" r="7" fill="#F0846F"/>
<text class="t" x="450" y="252" text-anchor="middle">Sinko box</text>
<text class="s" x="450" y="272" text-anchor="middle">checks your rules</text>
<!-- internet -->
<path d="M776 196h64a26 26 0 0 0 4-51 34 34 0 0 0-64-8 29 29 0 0 0-4 59z" style="fill:var(--card);stroke:var(--line);stroke-width:2;stroke-linejoin:round"/>
<text class="t" x="808" y="252" text-anchor="middle">The internet</text>
<text class="s" x="808" y="272" text-anchor="middle">only if allowed</text>
<!-- packets: allowed -->
<g class="p a1"><g transform="translate(170 135)"><rect class="pill-ok" x="0" y="-14" width="128" height="28" rx="14"/><text class="pt" x="64" y="5" text-anchor="middle">youtube.com?</text></g></g>
<g class="p a2"><g transform="translate(500 135)"><rect class="pill-ok" x="0" y="-14" width="116" height="28" rx="14"/><text class="pt" x="58" y="5" text-anchor="middle">youtube.com?</text></g></g>
<g class="p a3"><g transform="translate(730 165)"><rect class="pill-ok" x="-104" y="-14" width="104" height="28" rx="14"/><text class="pt" x="-52" y="5" text-anchor="middle">142.250.x.x</text></g></g>
<g class="p a4"><g transform="translate(400 165)"><rect class="pill-ok" x="-104" y="-14" width="104" height="28" rx="14"/><text class="pt" x="-52" y="5" text-anchor="middle">142.250.x.x</text></g></g>
<!-- packets: blocked -->
<g class="p b1"><g transform="translate(170 135)"><rect class="pill-ok" x="0" y="-14" width="120" height="28" rx="14"/><text class="pt" x="60" y="5" text-anchor="middle">tiktok.com?</text></g></g>
<g class="p b2"><g transform="translate(400 165)"><rect class="pill-no" x="-104" y="-14" width="104" height="28" rx="14"/><text class="pt" x="-52" y="5" text-anchor="middle">blocked</text></g></g>
<!-- live list -->
<rect class="card" x="80" y="298" width="740" height="82" rx="14"/>
<circle cx="104" cy="320" r="5" fill="var(--no)"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text class="s" x="118" y="325" style="font-weight:700">Live</text>
<g class="fade row1"><text class="t" x="104" y="350" style="font-size:15px;fill:var(--ok)">✓ allowed</text><text class="s" x="204" y="350">youtube.com</text></g>
<g class="fade row2"><text class="t" x="460" y="350" style="font-size:15px;fill:var(--no)">✕ stopped</text><text class="s" x="556" y="350">tiktok.com</text></g>
</svg>
