name: Host suggestions
# Once a month (and by hand), tools/suggest-hosts.py reads a million popular names with the small AI model trained
# from lists/ and writes the hosts it believes the lists miss. The file is a review list for a person: nothing here
# changes a list, opens a pull request or writes to the repository.
on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suggest:
    name: Suggest hosts the lists miss
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Train on lists/ and read Cisco Umbrella's top 1 million
        run: python tools/suggest-hosts.py --out host-suggestions.md --save-model host-model.json
      - name: Show the review list on the run's page
        run: cat host-suggestions.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-suggestions
          path: |
            host-suggestions.md
            host-model.json
