name: Release
# Push a tag like v3.0.0 (the same number as in the VERSION file) to publish a release. Or make the release on the website
# (Releases, Draft a new release, a new tag vX.Y.Z on master, Publish): publishing it starts this workflow too ("release:
# published"), which then adds the files and the notes to that release. A release that this workflow makes itself does
# not start it again (GitHub starts no workflow for what the workflow's own token does).
# Boxes download these assets; every download is counted by GitHub (the project's download count).
#
# Two jobs, so that the one that can write to the repository runs the least code: "build" has read-only access, runs
# the project's own scripts and uploads what they made; "publish" has write access, runs nothing from the repository
# and no third-party action, and only hands the files to the GitHub CLI that every runner already has.
# A box's update runs the installer from these files as root, so keep it that way: see SECURITY.md, "Who you are trusting".
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]

permissions:
  contents: read

# A release made on the website can start two runs at once (the new tag, and the release being published): the later one
# replaces the earlier, so the files are uploaded once.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    # A release published on the website for a tag that is not a version (vX.Y.Z) is not ours to fill in.
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag must match VERSION, and CHANGELOG must have dated notes for it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          [ "$tag" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          # --require-date: a heading that still says "Unreleased" (or has no real date) stops the release here
          python3 tools/changelog-section.py --require-date "$tag" > release-notes.md
      - name: Build the assets
        run: bash tools/build-release.sh dist
      - name: Check the archive the way a box does
        run: |
          cd dist
          sha256sum -c sinko.tar.gz.sha256
          tar -tzf sinko.tar.gz | head -n 5
          mkdir -p ../verify && tar -xzf sinko.tar.gz -C ../verify
          test "$(cat ../verify/sinko/VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Keep the notes next to the assets
        run: mv release-notes.md dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish
        run: |
          gh --version | head -n 1
          files=(dist/sinko.tar.gz dist/sinko.tar.gz.sha256 dist/install.sh)
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            # The release was made on the website, which created the tag that started this run: give it the files
            # and the notes instead of failing on "release already exists".
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Sinko $GITHUB_REF_NAME" --notes-file dist/release-notes.md \
              --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --latest \
              --title "Sinko $GITHUB_REF_NAME" --notes-file dist/release-notes.md
          fi
