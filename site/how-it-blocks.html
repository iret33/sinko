nd the token falls into the black hole, so the app can't open. The switches, left to right, are YouTube, TikTok, Roblox, Instagram, WhatsApp and ChatGPT, six of Sinko's 19 apps: pushed back allows, pulled forward blocks. Homework blocks games, video and social media; Offline break stops everything; Free time lets everything through. Slowed right down: a real box answers in milliseconds.</span><span class="sk-ar" lang="ar" dir="rtl">كل تطبيق على هاتف الطفل يسأل صندوق العائلة أولًا: «أين tiktok.com؟». عند البوابة يقرأ الصندوق كل سؤال ويقارنه بمفتاح ذلك التطبيق. إذا كان الجواب «نعم» يمضي السؤال إلى الراوتر ثم إلى الإنترنت، ويعود الجواب على المسار الخلفي. وإذا كان «لا» يصل السؤال إلى الفخ، فتسقط اللوحة ويقع في الثقب الأسود، فلا يُفتح التطبيق. المفاتيح، من اليسار إلى اليمين، هي YouTube وTikTok وRoblox وInstagram وWhatsApp وChatGPT، ستة من تطبيقات سينكو التسعة عشر: المفتاح المدفوع إلى الخلف يسمح، والمسحوب إلى الأمام يحظر. وقت الدراسة يحظر الألعاب والفيديو ومواقع التواصل، والاستراحة من الإنترنت توقف كل شيء، والوقت الحر يسمح بكل شيء. الحركة هنا بطيئة جدًا: الصندوق الحقيقي يجيب في أجزاء من الثانية.</span></figcaption></figure>

still.addEventListener("change", run);

svg.addEventListener("click", (event) => {

draw(1 / 60, true);
