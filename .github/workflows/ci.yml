name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:          # the release workflow runs the same checks before it publishes anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]     # Ubuntu 22.04 / Debian 12 / Debian 13 and Armbian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # the copy test runs the page's strings through node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Core, scheduler, updater, lists, doctor, diagnose, copy, release build
        run: python -m unittest discover -s tests -p "test_*.py" -v

  shell:
    name: Shell lint and installer end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Shell lint
        run: |
          pip install shellcheck-py
          shopt -s nullglob
          shellcheck install.sh uninstall.sh tools/*.sh tests/*.sh site/assemble.sh
      - name: Installer, updates source, migration, image tools, factory test (stubbed system; needs root and ports 18080-18087, 18091)
        run: sudo -E env "PATH=$PATH" bash tests/run_shell_tests.sh

  web:
    name: Page logic, counter service and site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          for f in web/*.js site/*.js telemetry/src/*.js; do node --check "$f"; done
      - name: Page logic
        run: node --test tests/*.test.js
      - name: Counter service (Cloudflare Worker)
        run: node --test telemetry/test/*.test.js
      - name: Project site
        run: node --test site/test/*.test.mjs

  browser:
    name: Browser tests (English and Arabic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Run the browser suites
        run: |
          mkdir -p screenshots
          for t in ui_smoke stage_smoke live_smoke box_smoke; do
            echo "::group::$t"; python tests/$t.py --shots screenshots; echo "::endgroup::"
          done
      - name: The real page against the real scheduler (the unit job has no browser and skips this file)
        run: python -m unittest discover -s tests -p "test_page_scheduler.py" -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots

  release-build:
    name: Release archive builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/build-release.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist
